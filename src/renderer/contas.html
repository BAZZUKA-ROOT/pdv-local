<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>PDV Local — Contas a Pagar</title>
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-tela="contas">
<div class="title-bar">
<div class="title-bar-left"><span class="brand-name">PDV Local</span></div>
<div class="title-bar-right">
<button class="title-btn minimize" onclick="api.minimizarJanela()">─</button>
<button class="title-btn maximize" onclick="api.maximizarJanela()">□</button>
<button class="title-btn close" onclick="api.fecharJanela()">✕</button>
</div>
</div>
<div class="app-container">
<nav class="sidebar" id="sidebar"></nav>
<main class="main-content">
<header class="top-header">

</header>
<div class="page-body">
<h1 class="page-title">Contas a Pagar</h1>
<div class="toolbar">
<button class="btn-primary" onclick="abrirNovaConta()">+ Nova Conta</button>
<input type="text" class="search-input" id="buscaConta" placeholder="Buscar conta...">
<div class="spacer"></div>
</div>
<div class="grid-wrap">
<table class="data-table">
<thead>
<tr>
<th>Ação</th>
<th>Número</th>
<th>Tipo</th>
<th>Descrição</th>
<th>Fornecedor</th>
<th>Valor</th>
<th>Valor Pago</th>
<th>Vencimento</th>
<th>Dias</th>
<th>Mês</th>
<th>Semana</th>
<th>Status</th>
</tr>
</thead>
<tbody id="tbodyContas"></tbody>
</table>
</div>
</div>
</main>
</div>
<!-- Modal conta -->
<div class="modal-overlay" id="contaModal" style="display:none">
<div class="modal" style="width:480px;max-height:90vh;overflow-y:auto">
<h3 id="contaModalTitulo">Nova Conta</h3>
<input type="hidden" id="contaId">
<div class="form-grid">
<div class="form-row"><label>Número</label><input type="text" id="contaNumero"></div>
<div class="form-row"><label>Tipo</label>
<select id="contaTipo" style="width:100%;border:1px solid var(--borda);border-radius:4px;padding:8px 10px">
<option>Despesa Fixa</option><option>Despesa Variável</option><option>Fornecedor</option><option>Imposto</option><option>Aluguel</option><option>Salário</option><option>Outros</option>
</select>
</div>
</div>
<div class="form-row"><label>Descrição *</label><input type="text" id="contaDescricao"></div>
<div class="form-row"><label>Fornecedor</label><input type="text" id="contaFornecedor"></div>
<div class="form-grid">
<div class="form-row"><label>Valor *</label><input type="number" step="0.01" id="contaValor"></div>
<div class="form-row"><label>Valor Pago</label><input type="number" step="0.01" id="contaValorPago"></div>
</div>
<div class="form-grid">
<div class="form-row"><label>Vencimento *</label><input type="date" id="contaVencimento"></div>
<div class="form-row"><label>Pago em</label><input type="date" id="contaPagoEm"></div>
</div>
<div class="form-grid">
<div class="form-row"><label>Categoria</label><input type="text" id="contaCategoria"></div>
<div class="form-row"><label>Status</label>
<select id="contaStatus" style="width:100%;border:1px solid var(--borda);border-radius:4px;padding:8px 10px">
<option value="pendente">Pendente</option><option value="pago">Pago</option><option value="atrasado">Atrasado</option><option value="cancelado">Cancelado</option>
</select>
</div>
</div>
<div class="form-row"><label>Referência</label><input type="text" id="contaReferencia"></div>
<div class="modal-actions">
<button class="btn-cancel" onclick="fechar('contaModal')">CANCELAR</button>
<button class="btn-primary" onclick="salvarConta()">SALVAR</button>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script src="shell.js"></script>
<script src="contas.js"></script>
</body>
</html>
