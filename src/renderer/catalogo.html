<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>PDV Local — Catálogo Online</title>
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-tela="catalogo">
<div class="title-bar">
 <div class="title-bar-left"><span class="brand-name">PDV Local</span></div>
 <div class="title-bar-right">
 <button class="title-btn minimize" onclick="api.minimizarJanela()">─</button>
 <button class="title-btn maximize" onclick="api.maximizarJanela()">□</button>
 <button class="title-btn close" onclick="api.fecharJanela()">✕</button>
 </div>
</div>
<div class="app-container">
 <nav class="sidebar" id="sidebar"></nav>
 <main class="main-content">
 <header class="top-header">
 <button class="header-btn"><svg viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></button>

 <div class="plan-badge">Plano Local</div>
 <button class="header-btn"><svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg></button>
 <div class="user-avatar">M</div>

 </header>
 <div class="page-body">
 <h1 class="page-title">Catálogo Online</h1>
 <div class="catalogo-layout">
 <div class="catalogo-main">
 <div class="toolbar">
 <div class="toggle-row" style="border:none;padding:0">
 <label style="font-size:14px;font-weight:600">Loja online ativa</label>
 <label class="toggle-switch">
 <input type="checkbox" id="lojaAtiva">
 <span class="toggle-slider"></span>
 </label>
 </div>
 <div class="spacer"></div>
 <input type="text" class="search-input" id="buscaCatalogo" placeholder="Buscar produto...">
 </div>
 <div class="grid-wrap">
 <table class="data-table">
 <thead>
 <tr>
 <th>Publicar</th>
 <th>Imagem</th>
 <th>Produto</th>
 <th>Código</th>
 <th>Preço</th>
 <th>Estoque</th>
 <th>Categoria</th>
 </tr>
 </thead>
 <tbody id="tbodyCatalogo"></tbody>
 </table>
 </div>
 </div>
 <div class="catalogo-sidebar">
 <h4>Configurações da Loja</h4>
 <div class="form-row"><label>Nome da loja</label><input type="text" id="cfgNomeLoja" value="Sandra Moda Assalto"></div>
 <div class="form-row"><label>Descrição</label><textarea id="cfgDescLoja" rows="3" style="resize:vertical">Moda feminina e acessórios</textarea></div>
 <div class="form-row"><label>Telefone / WhatsApp</label><input type="text" id="cfgTelefone" placeholder="(00) 00000-0000"></div>
 <div class="form-row"><label>Instagram</label><input type="text" id="cfgInstagram" placeholder="@sualoja"></div>
 <div class="form-row"><label>Link do catálogo</label><input type="text" id="cfgLink" value="https://pdvlocal.loja" readonly style="background:#f5f6f8;color:var(--texto-sec)"></div>
 <div style="margin-top:12px">
 <button class="btn-primary" onclick="salvarConfigLoja()" style="width:100%">Salvar configurações</button>
 </div>
 <div style="margin-top:16px;border-top:1px solid var(--borda);padding-top:12px">
 <h4 style="margin-bottom:8px">Resumo</h4>
 <div class="line"><span>Produtos publicados</span><strong id="resumoPublicados">0</strong></div>
 <div class="line"><span>Total de produtos</span><strong id="resumoTotal">0</strong></div>
 </div>
 </div>
 </div>
 </div>
 </main>
</div>
<div class="toast" id="toast"></div>
<script src="shell.js"></script>
<script src="catalogo.js"></script>
</body>
</html>
