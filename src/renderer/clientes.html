<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>PDV Local — Clientes</title>
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-tela="clientes">
<div class="title-bar">
<div class="title-bar-left"><span class="brand-name">PDV Local</span></div>
<div class="title-bar-right">
<button class="title-btn minimize" onclick="api.minimizarJanela()">─</button>
<button class="title-btn maximize" onclick="api.maximizarJanela()">□</button>
<button class="title-btn close" onclick="api.fecharJanela()">✕</button>
</div>
</div>
<div class="app-container">
<nav class="sidebar" id="sidebar"></nav>
<main class="main-content">
<header class="top-header">

<div class="plan-badge">Plano Local</div>
<button class="header-btn"><svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg></button>

</header>
<div class="page-body">
<h1 class="page-title">Clientes</h1>
<div class="toolbar">
<button class="btn-primary" onclick="abrirNovoCliente()">+ Novo Cliente</button>
<input type="text" class="search-input" id="buscaCliente" placeholder="Buscar cliente...">
<div class="spacer"></div>
</div>
<div class="grid-wrap">
<table class="data-table">
<thead>
<tr>
<th>Ação</th>
<th>Código</th>
<th>Nome</th>
<th>CPF/CNPJ</th>
<th>RG/I.E.</th>
<th>Telefone</th>
<th>Data Nasc.</th>
<th>Débito</th>
<th>Crédito</th>
<th>Observações</th>
</tr>
</thead>
<tbody id="tbodyClientes"></tbody>
</table>
</div>
</div>
</main>
</div>
<!-- Modal cliente -->
<div class="modal-overlay" id="clienteModal" style="display:none">
<div class="modal" style="width:520px;max-height:90vh;overflow-y:auto">
<h3 id="clienteModalTitulo">Novo Cliente</h3>
<input type="hidden" id="clienteId">
<div class="form-row"><label>Nome *</label><input type="text" id="cliNome"></div>
<div class="form-grid">
<div class="form-row"><label>CPF/CNPJ</label><input type="text" id="cliCpfCnpj"></div>
<div class="form-row"><label>RG/I.E.</label><input type="text" id="cliRgIe"></div>
</div>
<div class="form-grid">
<div class="form-row"><label>Telefone</label><input type="text" id="cliTelefone"></div>
<div class="form-row"><label>Email</label><input type="email" id="cliEmail"></div>
</div>
<div class="form-row"><label>Endereço</label><input type="text" id="cliEndereco"></div>
<div class="form-grid">
<div class="form-row"><label>Número</label><input type="text" id="cliNumero"></div>
<div class="form-row"><label>Complemento</label><input type="text" id="cliComplemento"></div>
</div>
<div class="form-grid">
<div class="form-row"><label>Bairro</label><input type="text" id="cliBairro"></div>
<div class="form-row"><label>Cidade</label><input type="text" id="cliCidade"></div>
</div>
<div class="form-grid">
<div class="form-row"><label>Estado</label><input type="text" id="cliEstado" maxlength="2"></div>
<div class="form-row"><label>CEP</label><input type="text" id="cliCep"></div>
</div>
<div class="form-row"><label>Data de Nascimento</label><input type="date" id="cliDataNasc"></div>
<div class="form-row"><label>Observações</label><textarea id="cliObs" rows="3" style="resize:vertical"></textarea></div>
<div class="modal-actions">
<button class="btn-cancel" onclick="fechar('clienteModal')">CANCELAR</button>
<button class="btn-primary" onclick="salvarCliente()">SALVAR</button>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script src="shell.js"></script>
<script src="clientes.js"></script>
</body>
</html>
